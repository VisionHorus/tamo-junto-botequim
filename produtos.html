<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produtos - Painel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-[#F6F5F4] min-h-screen flex">

  <!-- SIDEBAR -->

    <div id="sidebar"></div>

  <!-- CONTEÚDO -->
  <main class="flex-1 p-4 md:p-8">
    <div class="max-w-5xl mx-auto space-y-6">

      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-2xl md:text-3xl font-bold tracking-tight text-[#2E2E2F]">Produtos</h2>
          <p class="text-sm md:text-base text-[#6F6F72]">Gerencie os itens do cardápio</p>
        </div>
        <button
          id="abrir-modal-criar"
          class="bg-[#C47F4A] hover:bg-[#A46538] text-white rounded-md px-4 py-2 shadow-sm transition-colors flex items-center gap-2"
        >
          <i class="fa-solid fa-plus"></i> Adicionar Produto
        </button>
      </div>

      <!-- LISTA DE PRODUTOS -->
      <div id="content" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- preenchido automaticamente pelo produtos.js -->
      </div>

    </div>
  </main>

  <!-- MODAL (criar/editar produto) -->
  <div id="modal-produto" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg shadow-lg w-full max-w-lg p-6 space-y-4">

      <div class="flex items-center justify-between">
        <h3 id="modal-titulo" class="text-lg font-semibold text-[#2E2E2F]">Adicionar Produto</h3>
        <button id="fechar-modal" class="text-[#6F6F72] hover:text-[#2E2E2F]">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="grid gap-4">

        <div class="grid gap-2">
          <label for="nome" class="text-sm text-[#6F6F72]">Nome do produto *</label>
          <input id="nome" type="text" placeholder="Ex: Classic Margherita"
            class="border border-[#E4E2E0] rounded-md px-3 py-2 focus:border-[#C47F4A] focus:ring-1 focus:ring-[#C47F4A] outline-none" />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="grid gap-2">
            <label for="categoria" class="text-sm text-[#6F6F72]">Categoria *</label>
            <select id="categoria"
              class="border border-[#E4E2E0] rounded-md px-3 py-2 focus:border-[#C47F4A] focus:ring-1 focus:ring-[#C47F4A] outline-none">
              <option value="">Selecione</option>
            </select>
          </div>

          <div class="grid gap-2">
            <label for="preco" class="text-sm text-[#6F6F72]">Preço (R$) *</label>
            <input id="preco" type="number" step="0.01" placeholder="0.00"
              class="border border-[#E4E2E0] rounded-md px-3 py-2 focus:border-[#C47F4A] focus:ring-1 focus:ring-[#C47F4A] outline-none" />
          </div>
        </div>

        <div class="grid gap-2">
          <label for="imagem" class="text-sm text-[#6F6F72]">Foto do produto</label>
          <input id="imagem" type="file" accept="image/png,image/jpeg,image/webp"
            class="border border-[#E4E2E0] rounded-md px-3 py-2 file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:bg-[#F6F5F4] file:text-[#6F6F72] file:cursor-pointer" />
        </div>

        <div class="grid gap-2">
          <label for="descricao" class="text-sm text-[#6F6F72]">Descrição</label>
          <textarea id="descricao" placeholder="Ingredientes, detalhes do prato..." rows="3"
            class="border border-[#E4E2E0] rounded-md px-3 py-2 focus:border-[#C47F4A] focus:ring-1 focus:ring-[#C47F4A] outline-none resize-none"></textarea>
        </div>

        <div class="mb-4">
            <label class="block mb-2">Unidade</label>

            <select
                id="unidade"
                class="w-full border rounded-md p-2"
            >
                <option value="">Selecione</option>
            </select>
        </div>

      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button id="cancelar-modal" type="button"
          class="border border-[#E4E2E0] text-[#6F6F72] hover:bg-[#F6F5F4] rounded-md px-4 py-2 transition-colors">
          Cancelar
        </button>
        <button id="btn" type="button"
          class="bg-[#C47F4A] hover:bg-[#A46538] text-white rounded-md px-4 py-2 shadow-sm transition-colors">
          Salvar Produto
        </button>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="./assets/js/config.js"></script>
  <script type="module" src="./assets/js/produtos.js"></script>
  <script type="module" src="./assets/js/sidebar.js"></script>
</body>
</html>
